name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

# A throwaway PostgreSQL for each job. Trust authentication means no password is
# needed (or stored) for this short-lived, job-private container.
env:
  DATABASE_URL: postgresql+psycopg://lexflow@127.0.0.1:5432/lexflow
  TEST_DATABASE_URL: postgresql+psycopg://lexflow@127.0.0.1:5432/lexflow_test

jobs:
  frontend:
    name: Front end - lint, format, typecheck, contract, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies from the lockfile
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

      - name: TypeScript
        run: npm run typecheck

      - name: API types match server/openapi.json
        run: npm run api:check

      - name: Sample data matches src/data/mockData.ts
        run: npm run sample-data:check

      - name: Tests
        run: npm test

      - name: Production build
        run: npm run build

  backend:
    name: Back end - lint, types, migrations, tests, OpenAPI
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector on Debian 13 (same PostgreSQL and glibc as postgres:17; ADR 0016).
        image: pgvector/pgvector:pg17-trixie
        env:
          POSTGRES_USER: lexflow
          POSTGRES_DB: lexflow
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lexflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/requirements*.txt

      - name: Install pinned dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff (lint)
        run: ruff check .

      - name: Ruff (format)
        run: ruff format --check .

      - name: mypy (strict)
        run: mypy

      - name: Migrations apply to an empty database
        run: alembic upgrade head

      - name: Tests
        run: pytest -q

      - name: server/openapi.json is up to date
        run: python scripts/export_openapi.py --check

  e2e:
    name: End-to-end - browser, API and database
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector on Debian 13 (same PostgreSQL and glibc as postgres:17; ADR 0016).
        image: pgvector/pgvector:pg17-trixie
        env:
          POSTGRES_USER: lexflow
          POSTGRES_DB: lexflow
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lexflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/requirements*.txt

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install API dependencies
        run: pip install -r server/requirements.txt

      - name: Install front-end dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Run the end-to-end tests
        run: npm run e2e

      - name: Keep the report and API log when a test fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            e2e/.state/api.log
          retention-days: 7
          # The API log lives in the hidden e2e/.state folder.
          include-hidden-files: true
